<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wallace Barber</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: #1e1e1e;
  padding: 30px;
  border-radius: 12px;
  width: 100%;
  max-width: 420px;
  color: white;
}

h1 { text-align: center; }
p { text-align: center; color: #aaa; }

input, select, button {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
}

input, select {
  background: #2c2c2c;
  color: white;
}

button {
  background: #25D366;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #1ebe5d; }

.indisponivel {
  color: #ff4d4d;
}
</style>
</head>
<body>

<div class="card">
  <h1>💈 Wallace Barber</h1>
  <p>Agende seu horário</p>

  <form id="form">
    <input type="text" id="nome" placeholder="Seu nome" required>
    <input type="text" id="telefone" placeholder="Telefone" required>
    <input type="date" id="data" required>

    <select id="horario" required>
      <option value="">Selecione o horário</option>
    </select>

    <select id="servico" required>
      <option value="">Selecione o serviço</option>
      <option>Corte</option>
      <option>Barba</option>
      <option>Corte + Barba</option>
    </select>

    <button type="submit">Agendar no WhatsApp</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "wallacebarber-e3ff6.firebaseapp.com",
  databaseURL: "https://wallacebarber-e3ff6-default-rtdb.firebaseio.com",
  projectId: "wallacebarber-e3ff6",
  storageBucket: "wallacebarber-e3ff6.appspot.com",
  messagingSenderId: "958189269901",
  appId: "1:958189269901:web:c89be159cfbb65b90703c4"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const numeroBarbearia = "5521964768235";

const horariosFixos = [
"10:20","11:00","11:40","12:20","13:00","13:40",
"14:20","15:00","15:40","16:20","17:00","17:40",
"18:20","19:00","19:40","20:20","21:00","21:40",
"22:20","23:00"
];

const selectHorario = document.getElementById("horario");
const inputData = document.getElementById("data");

function carregarHorarios(dataSelecionada) {
  selectHorario.innerHTML = '<option value="">Selecione o horário</option>';

  if (!dataSelecionada) return;

  const agRef = ref(database, "agendamentos");

  onValue(agRef, (snapshot) => {
    const dados = snapshot.val();
    let horariosOcupados = [];

    if (dados) {
      Object.values(dados).forEach(a => {
        if (a.data === dataSelecionada) {
          horariosOcupados.push(a.horario);
        }
      });
    }

    horariosFixos.forEach(horario => {
      const option = document.createElement("option");
      option.value = horario;

      if (horariosOcupados.includes(horario)) {
        option.textContent = horario + " - Indisponível";
        option.disabled = true;
        option.classList.add("indisponivel");
      } else {
        option.textContent = horario;
      }

      selectHorario.appendChild(option);
    });
  }, { onlyOnce: true });
}

inputData.addEventListener("change", () => {
  carregarHorarios(inputData.value);
});

document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const data = inputData.value;
  const horario = selectHorario.value;
  const servico = document.getElementById("servico").value;

  try {
    await push(ref(database, "agendamentos"), {
      nome,
      telefone,
      data,
      horario,
      servico,
      criadoEm: new Date().toISOString()
    });

    const mensagem =
`Olá, gostaria de agendar um horário.

Nome: ${nome}
Telefone: ${telefone}
Data: ${data}
Horário: ${horario}
Serviço: ${servico}`;

    const url = `https://wa.me/${numeroBarbearia}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, "_blank");

    alert("Agendamento realizado com sucesso!");
    document.getElementById("form").reset();
    selectHorario.innerHTML = '<option value="">Selecione o horário</option>';

  } catch (error) {
    alert("Erro ao salvar.");
    console.error(error);
  }
});
</script>

</body>
</html>
